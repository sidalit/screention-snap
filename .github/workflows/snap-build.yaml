name: Snap build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to beta
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snap-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  snap:
    name: release / amd64
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show snapcraft.yaml
        run: cat snap/snapcraft.yaml

      - name: Build snap
        id: snap
        uses: canonical/craft-actions/snapcraft/pack@v1
        env:
          SNAPCRAFT_BUILD_INFO: '1'
        with:
          verbosity: verbose

      - name: Show Snapcraft logs on failure
        if: failure() && steps.snap.outcome == 'failure'
        shell: bash
        run: |
          shopt -s nullglob
          for log in "${XDG_STATE_HOME:-$HOME/.local/state}"/snapcraft/log/*.log; do
            echo "::group::Snapcraft log: $(basename "$log")"
            stop_token=$(cat /proc/sys/kernel/random/uuid)
            echo "::stop-commands::$stop_token"
            cat "$log"
            printf '\n::%s::\n' "$stop_token"
            echo '::endgroup::'
          done

      - name: Read artifact name
        id: metadata
        env:
          SNAP_FILE: ${{ steps.snap.outputs.snaps }}
        run: |
          filename=$(basename "$SNAP_FILE" .snap)
          echo "name=${filename//_/-}" >> "$GITHUB_OUTPUT"

      - name: Save snap
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.name }}
          path: ${{ steps.snap.outputs.snaps }}
          if-no-files-found: error
          compression-level: 0

      - name: Publish snap
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish == true)
        timeout-minutes: 45
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_FILE: ${{ steps.snap.outputs.snaps }}
        run: |
          snapcraft upload "$SNAP_FILE" --release beta \
            2> >(sed -u '/^Status: processing\r*$/d' >&2)
